  <div class="flex order-1 flex-col sm:flex-row gap-3 sm:gap-10 items-center">
    {{ partial "header/avatar" . }}

      {{ partial "header/nav" . }}

  <div class="flex order-2 justify-center sm:justify-end items-center">
    {{ partial "header/theme-button" . }}
  </div>

</header>
